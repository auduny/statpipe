name: packages

# Release procedure:
#   1. bump $version in statpipe and push master
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. this workflow builds deb+rpm, creates a DRAFT release with the
#      packages attached, and updates the Homebrew formula
#   4. review and publish the draft release
# Assets go on a draft because this repo uses immutable releases:
# assets cannot be attached after a release is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build packages for (e.g. v1.2.0)
        required: true

permissions:
  contents: write # create releases and push formula updates

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Install fpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm perl
          sudo gem install fpm --no-document

      - name: Build deb and rpm
        run: |
          set -eux
          pod2man --release "${{ steps.v.outputs.version }}" \
            --center "User Commands" statpipe statpipe.1
          mkdir -p dist
          fpm -s dir -t deb -n statpipe \
            --version "${{ steps.v.outputs.version }}" --iteration 1 \
            --architecture all \
            --license "GPL-2.0-only" \
            --maintainer "Audun Ytterdal <audun@ytterdal.net>" \
            --url "https://github.com/auduny/statpipe" \
            --description "Swiss-knife statistics for logfiles and pipes" \
            --depends perl \
            --package dist/ \
            statpipe=/usr/bin/statpipe \
            statpipe.1=/usr/share/man/man1/statpipe.1
          fpm -s dir -t rpm -n statpipe \
            --version "${{ steps.v.outputs.version }}" --iteration 1 \
            --architecture noarch \
            --license "GPL-2.0-only" \
            --maintainer "Audun Ytterdal <audun@ytterdal.net>" \
            --url "https://github.com/auduny/statpipe" \
            --description "Swiss-knife statistics for logfiles and pipes" \
            --depends perl \
            --depends "perl(Getopt::Long)" \
            --depends "perl(Pod::Usage)" \
            --depends "perl(Scalar::Util)" \
            --depends "perl(Time::HiRes)" \
            --package dist/ \
            statpipe=/usr/bin/statpipe \
            statpipe.1=/usr/share/man/man1/statpipe.1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: statpipe-packages
          path: dist/*

      - name: Create draft release with packages
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: statpipe ${{ steps.v.outputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/*

  homebrew:
    # Update Formula/statpipe.rb on the default branch to point at the
    # new tag's tarball. Runs on tag push only, not manual test builds.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Homebrew formula
        run: |
          set -eux
          TAG="${{ github.ref_name }}"
          URL="https://github.com/auduny/statpipe/archive/refs/tags/${TAG}.tar.gz"
          SHA="$(curl -sL "$URL" | sha256sum | cut -d ' ' -f 1)"
          sed -i \
            -e "s|url \".*\"|url \"$URL\"|" \
            -e "s|sha256 \".*\"|sha256 \"$SHA\"|" \
            Formula/statpipe.rb

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/statpipe.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
          else
            git commit -m "Update Homebrew formula for ${{ github.ref_name }}"
            git push
          fi
